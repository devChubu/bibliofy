<!DOCTYPE html>
<html lang="en" data-theme="light" data-size="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme: Light (default) ── */
[data-theme="light"] {
  --bg: #ffffff;
  --bg-alt: #f8f9fa;
  --text: #2d2d2d;
  --text2: #6b7280;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-light: #dbeafe;
  --border: #e5e7eb;
  --code-bg: #f3f4f6;
  --code-text: #1f2937;
  --sidebar-bg: #1e293b;
  --sidebar-text: #e2e8f0;
  --sidebar-accent: #60a5fa;
  --sidebar-hover: rgba(255,255,255,.08);
  --callout-concept-border: #2563eb;
  --callout-concept-bg: rgba(37,99,235,.06);
  --callout-warning-border: #f59e0b;
  --callout-warning-bg: rgba(245,158,11,.06);
  --callout-tip-border: #10b981;
  --callout-tip-bg: rgba(16,185,129,.06);
  --callout-takeaway-border: #8b5cf6;
  --callout-takeaway-bg: rgba(139,92,246,.06);
  --callout-deepdive-border: #06b6d4;
  --callout-deepdive-bg: rgba(6,182,212,.06);
  --callout-prereq-border: #64748b;
  --callout-prereq-bg: rgba(100,116,139,.06);
  --cover-from: #1e293b;
  --cover-to: #2563eb;
  --table-header-bg: #1e293b;
  --table-header-text: #ffffff;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Consolas', 'Fira Code', 'Courier New', monospace;
}

/* ── Theme: Dark ── */
[data-theme="dark"] {
  --bg: #1a1b1e;
  --bg-alt: #222326;
  --text: #d4d4d8;
  --text2: #9ca3af;
  --accent: #60a5fa;
  --accent-hover: #93bbfd;
  --accent-light: rgba(96,165,250,.15);
  --border: #3f3f46;
  --code-bg: #2a2b2e;
  --code-text: #e5e7eb;
  --sidebar-bg: #111318;
  --sidebar-text: #a1a1aa;
  --sidebar-accent: #60a5fa;
  --sidebar-hover: rgba(255,255,255,.06);
  --callout-concept-border: #60a5fa;
  --callout-concept-bg: rgba(96,165,250,.1);
  --callout-warning-border: #fbbf24;
  --callout-warning-bg: rgba(251,191,36,.1);
  --callout-tip-border: #34d399;
  --callout-tip-bg: rgba(52,211,153,.1);
  --callout-takeaway-border: #a78bfa;
  --callout-takeaway-bg: rgba(167,139,250,.1);
  --callout-deepdive-border: #22d3ee;
  --callout-deepdive-bg: rgba(34,211,238,.1);
  --callout-prereq-border: #94a3b8;
  --callout-prereq-bg: rgba(148,163,184,.1);
  --cover-from: #111318;
  --cover-to: #1e3a5f;
  --table-header-bg: #111318;
  --table-header-text: #d4d4d8;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Consolas', 'Fira Code', 'Courier New', monospace;
}

/* ── Theme: Book ── */
[data-theme="book"] {
  --bg: #f5f0e8;
  --bg-alt: #ebe5d9;
  --text: #3d3229;
  --text2: #7a6b5d;
  --accent: #8b5e3c;
  --accent-hover: #6d4a2f;
  --accent-light: rgba(139,94,60,.1);
  --border: #d4c5b0;
  --code-bg: #ebe5d9;
  --code-text: #3d3229;
  --sidebar-bg: #2c1e12;
  --sidebar-text: #d4c5b0;
  --sidebar-accent: #d4a574;
  --sidebar-hover: rgba(255,255,255,.06);
  --callout-concept-border: #8b5e3c;
  --callout-concept-bg: rgba(139,94,60,.08);
  --callout-warning-border: #c27830;
  --callout-warning-bg: rgba(194,120,48,.08);
  --callout-tip-border: #6b8f5e;
  --callout-tip-bg: rgba(107,143,94,.08);
  --callout-takeaway-border: #7d6b99;
  --callout-takeaway-bg: rgba(125,107,153,.08);
  --callout-deepdive-border: #5b8a8a;
  --callout-deepdive-bg: rgba(91,138,138,.08);
  --callout-prereq-border: #8a7e6e;
  --callout-prereq-bg: rgba(138,126,110,.08);
  --cover-from: #2c1e12;
  --cover-to: #5c3d24;
  --table-header-bg: #3d3229;
  --table-header-text: #f5f0e8;
  --font-body: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  --font-heading: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}

/* ── Font Size Scaling ── */
[data-size="small"] { font-size: 14px; }
[data-size="medium"] { font-size: 16px; }
[data-size="large"] { font-size: 18px; }

/* ── Body ── */
body {
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.75;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ── Progress Bar ── */
.progress-bar {
  position: fixed; top: 0; left: 0;
  height: 3px; width: 0;
  background: var(--accent);
  z-index: 1001;
  transition: width 80ms linear;
}

/* ── Sticky Chapter Header (mobile) ── */
.chapter-header-bar {
  display: none;
  position: fixed; top: 3px; left: 0; right: 0;
  height: 44px;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  z-index: 999;
  align-items: center;
  padding: 0 12px;
  font-size: 0.85rem;
  font-family: var(--font-heading);
}
.chapter-header-text {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Hamburger Menu Button ── */
.menu-btn {
  display: none;
  width: 44px; height: 44px;
  background: none; border: none;
  color: var(--sidebar-text);
  font-size: 1.4rem;
  cursor: pointer;
  flex-shrink: 0;
  margin-right: 8px;
}

/* ── Controls Bar (theme + font) ── */
.controls-bar {
  position: fixed; top: 10px; right: 16px;
  z-index: 1000;
  display: flex; gap: 8px; align-items: center;
}
.theme-toggle, .font-controls {
  display: flex; gap: 2px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
}
.theme-toggle button, .font-controls button {
  width: 36px; height: 32px;
  border: none; border-radius: 6px;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.theme-toggle button:hover, .font-controls button:hover {
  background: var(--border);
  color: var(--text);
}
.theme-toggle button.active {
  background: var(--accent);
  color: #fff;
}

/* ── Sidebar ── */
.sidebar {
  position: fixed; top: 0; left: 0;
  width: 280px; height: 100vh;
  background: var(--sidebar-bg);
  overflow-y: auto;
  padding: 24px 0;
  z-index: 1000;
  transition: transform .25s ease;
}
.sidebar-title {
  padding: 0 20px 20px;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.3;
  border-bottom: 1px solid rgba(255,255,255,.1);
  margin-bottom: 16px;
}
.sidebar-title small {
  display: block;
  font-weight: 400;
  font-size: 0.78rem;
  opacity: .6;
  margin-top: 4px;
}
.sidebar nav { padding: 0 12px; }
.part-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--sidebar-accent);
  padding: 16px 8px 6px;
  font-family: var(--font-heading);
  font-weight: 600;
}
.sidebar a {
  display: block;
  padding: 5px 8px 5px 12px;
  font-size: 0.8rem;
  color: var(--sidebar-text);
  text-decoration: none;
  border-radius: 4px;
  border-left: 3px solid transparent;
  transition: background .12s, border-color .12s;
  line-height: 1.4;
}
.sidebar a.ch { font-weight: 600; }
.sidebar a:hover {
  background: var(--sidebar-hover);
  color: #fff;
}
.sidebar a.active {
  border-left-color: var(--sidebar-accent);
  background: var(--sidebar-hover);
  color: #fff;
  font-weight: 600;
}
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 999;
}
.sidebar-footer {
  padding: 16px 20px;
  font-size: 0.7rem;
  color: var(--sidebar-text);
  opacity: .4;
  margin-top: 20px;
}

/* ── Main Content ── */
.main {
  margin-left: 280px;
  max-width: 820px;
  padding: 40px 48px 80px;
}

/* ── Typography ── */
h1 {
  font-family: var(--font-heading);
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 8px;
}
h2 {
  font-family: var(--font-heading);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text);
  margin-top: 56px;
  padding-top: 24px;
  border-top: 2px solid var(--border);
  line-height: 1.3;
}
.ch-num {
  color: var(--accent);
  font-size: 0.85em;
  margin-right: 4px;
}
h3 {
  font-family: var(--font-heading);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--accent);
  margin-top: 36px;
  margin-bottom: 12px;
}
h4 {
  font-family: var(--font-heading);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  margin-top: 24px;
  margin-bottom: 8px;
}
p { margin-bottom: 14px; }
ul, ol { margin: 0 0 14px 24px; }
li { margin-bottom: 6px; }
li > ul, li > ol { margin-top: 6px; margin-bottom: 0; }
strong { font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Cover Banner ── */
.cover-banner {
  background: linear-gradient(135deg, var(--cover-from) 0%, var(--cover-to) 100%);
  color: #fff;
  padding: 48px;
  border-radius: 12px;
  margin-bottom: 48px;
}
.cover-banner h1 { color: #fff; }
.cover-banner .subtitle {
  font-size: 1.05rem;
  opacity: .85;
  margin-top: 12px;
  line-height: 1.6;
  max-width: 600px;
}

/* ── Chapter Summary ── */
.chapter-summary {
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  font-size: 0.92rem;
  margin: 12px 0 28px;
  position: relative;
}
.reading-time {
  position: absolute;
  top: 12px; right: 16px;
  font-size: 0.75rem;
  color: var(--text2);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2px 10px;
}

/* ── Callout Boxes ── */
.callout {
  border-radius: 8px;
  padding: 16px 20px;
  margin: 20px 0;
  font-size: 0.92rem;
  line-height: 1.6;
  border-left: 4px solid;
}
.callout-title {
  font-family: var(--font-heading);
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.callout-title::before { font-size: 1rem; }
.callout p:last-child { margin-bottom: 0; }

.callout.concept {
  border-color: var(--callout-concept-border);
  background: var(--callout-concept-bg);
}
.callout.concept .callout-title { color: var(--callout-concept-border); }
.callout.concept .callout-title::before { content: "\1F4D6"; }

.callout.warning {
  border-color: var(--callout-warning-border);
  background: var(--callout-warning-bg);
}
.callout.warning .callout-title { color: var(--callout-warning-border); }
.callout.warning .callout-title::before { content: "\26A0\FE0F"; }

.callout.tip {
  border-color: var(--callout-tip-border);
  background: var(--callout-tip-bg);
}
.callout.tip .callout-title { color: var(--callout-tip-border); }
.callout.tip .callout-title::before { content: "\1F4A1"; }

.callout.key-takeaway {
  border-color: var(--callout-takeaway-border);
  background: var(--callout-takeaway-bg);
}
.callout.key-takeaway .callout-title { color: var(--callout-takeaway-border); }
.callout.key-takeaway .callout-title::before { content: "\2B50"; }

.callout.deep-dive {
  border-color: var(--callout-deepdive-border);
  background: var(--callout-deepdive-bg);
}
.callout.deep-dive .callout-title { color: var(--callout-deepdive-border); }
.callout.deep-dive .callout-title::before { content: "\1F30A"; }
.callout.deep-dive details summary {
  cursor: pointer;
  list-style: none;
}
.callout.deep-dive details summary::-webkit-details-marker { display: none; }
.callout.deep-dive details summary::after {
  content: "\25B6";
  font-size: 0.7rem;
  margin-left: 6px;
  transition: transform .2s;
  display: inline-block;
}
.callout.deep-dive details[open] summary::after { transform: rotate(90deg); }
.deep-dive-content { margin-top: 12px; }

.callout.prerequisite {
  border-color: var(--callout-prereq-border);
  background: var(--callout-prereq-bg);
}
.callout.prerequisite .callout-title { color: var(--callout-prereq-border); }
.callout.prerequisite .callout-title::before { content: "\1F4CB"; }

/* ── Code Blocks ── */
.code-block { position: relative; margin: 16px 0; }
.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  padding: 6px 12px;
  font-family: var(--font-heading);
  font-size: 0.75rem;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px 20px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.55;
  overflow-x: auto;
  color: var(--code-text);
  -webkit-overflow-scrolling: touch;
}
.code-header + pre { border-radius: 0 0 6px 6px; }
code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 2px 5px;
  border-radius: 3px;
  color: var(--accent);
}
pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
}
.copy-btn {
  position: absolute;
  top: 6px; right: 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 0.72rem;
  color: var(--text2);
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
  font-family: var(--font-heading);
}
.code-block:hover .copy-btn,
.code-block .copy-btn.visible { opacity: 1; }
.code-caption {
  font-size: 0.8rem;
  color: var(--text2);
  font-style: italic;
  margin-top: -8px;
  margin-bottom: 16px;
}

/* ── Tables ── */
.table-scroll {
  overflow-x: auto;
  margin: 16px 0;
  border-radius: 8px;
  border: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  font-family: var(--font-heading);
}
th {
  background: var(--table-header-bg);
  color: var(--table-header-text);
  padding: 10px 14px;
  text-align: left;
  text-transform: uppercase;
  font-size: 0.78rem;
  letter-spacing: 0.5px;
  font-weight: 600;
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tr:nth-child(even) td { background: var(--bg-alt); }
tr:last-child td { border-bottom: none; }

/* ── Diagrams ── */
.figure {
  margin: 24px 0;
  text-align: center;
  cursor: default;
}
.figure-caption {
  font-size: 0.82rem;
  color: var(--text2);
  margin-top: 10px;
  font-style: italic;
}
.diagram-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
  justify-content: center;
}
.d-block {
  border-radius: 8px;
  padding: 12px 18px;
  text-align: center;
  font-family: var(--font-heading);
  font-size: 0.85rem;
  font-weight: 600;
  min-width: 100px;
  border: 2px solid;
}
.d-block small {
  display: block;
  font-weight: 400;
  font-size: 0.75rem;
  opacity: .7;
  margin-top: 2px;
}
.d-blue   { border-color: var(--accent);               background: var(--accent-light); color: var(--text); }
.d-navy   { border-color: var(--callout-prereq-border); background: var(--callout-prereq-bg); color: var(--text); }
.d-green  { border-color: var(--callout-tip-border);    background: var(--callout-tip-bg); color: var(--text); }
.d-orange { border-color: var(--callout-warning-border);background: var(--callout-warning-bg); color: var(--text); }
.d-purple { border-color: var(--callout-takeaway-border);background: var(--callout-takeaway-bg); color: var(--text); }
.d-gray   { border-color: var(--border);                background: var(--bg-alt); color: var(--text); }
.d-arrow {
  font-size: 1.3rem;
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
}

/* Inline SVGs should inherit theme */
.figure svg text { fill: var(--text); font-family: var(--font-heading); }
.figure svg rect,
.figure svg circle,
.figure svg ellipse { transition: fill .2s, stroke .2s; }

/* ── References ── */
.references {
  margin: 32px 0;
  padding: 16px 20px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.references h4 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 0.88rem;
  color: var(--text2);
}
.references ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.references li {
  padding: 4px 0;
  font-size: 0.85rem;
  line-height: 1.5;
}
.references li::before {
  content: "\1F517";
  margin-right: 6px;
  font-size: 0.8rem;
}

/* ── Bibliography ── */
.bibliography-list {
  font-size: 0.9rem;
  line-height: 1.6;
  padding-left: 24px;
}
.bibliography-list li { margin-bottom: 8px; }

/* ── Chapter Navigation ── */
.chapter-nav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.chapter-nav button {
  min-height: 44px;
  padding: 10px 20px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: var(--font-heading);
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
  transition: background .15s, border-color .15s;
  max-width: 48%;
  text-align: left;
}
.chapter-nav button:hover {
  background: var(--accent-light);
  border-color: var(--accent);
}
.chapter-nav button:disabled {
  opacity: .3;
  cursor: default;
}
.chapter-nav button:disabled:hover {
  background: var(--bg-alt);
  border-color: var(--border);
}

/* ── Back to Top ── */
.back-to-top {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .2s, transform .2s;
  z-index: 998;
  display: flex; align-items: center; justify-content: center;
}
.back-to-top.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ── Bookmark Banner ── */
.bookmark-banner {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 1000;
  font-size: 0.88rem;
  font-family: var(--font-heading);
  transform: translateY(100%);
  transition: transform .3s ease;
}
.bookmark-banner.visible { transform: translateY(0); }
.bookmark-banner button {
  padding: 6px 16px;
  border: 1px solid var(--sidebar-text);
  border-radius: 6px;
  background: transparent;
  color: var(--sidebar-text);
  font-size: 0.82rem;
  cursor: pointer;
  font-family: var(--font-heading);
  min-height: 36px;
}
.bookmark-banner button:first-of-type {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── Diagram Lightbox ── */
.lightbox {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  padding: 24px;
  cursor: pointer;
}
.lightbox.visible { display: flex; }
.lightbox-content {
  max-width: 95vw;
  max-height: 90vh;
  overflow: auto;
  background: var(--bg);
  border-radius: 12px;
  padding: 24px;
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
    width: 280px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.visible { display: block; }
  .menu-btn { display: flex; }
  .chapter-header-bar { display: flex; }
  .main {
    margin-left: 0;
    padding: 60px 16px 80px;
  }
  .controls-bar {
    top: auto;
    bottom: 72px;
    right: 16px;
    flex-direction: column;
  }
  .cover-banner { padding: 32px 24px; }
  .cover-banner h1 { font-size: 1.6rem; }
  h2 { font-size: 1.3rem; }
  .back-to-top { bottom: 72px; }
  .figure { cursor: pointer; }
}

@media (max-width: 480px) {
  .main { padding: 56px 14px 80px; }
  .chapter-nav { flex-direction: column; }
  .chapter-nav button { max-width: 100%; }
  .controls-bar { right: 10px; }
}

/* ── Print ── */
@media print {
  .sidebar, .sidebar-overlay, .chapter-header-bar, .controls-bar,
  .progress-bar, .back-to-top, .bookmark-banner, .lightbox,
  .menu-btn, .copy-btn, .chapter-nav { display: none !important; }
  .main {
    margin-left: 0; max-width: 100%; padding: 0;
  }
  h2 { break-before: page; }
  .callout, pre, .figure, .table-scroll { break-inside: avoid; }
  a { color: var(--text); text-decoration: underline; }
  a[href]::after { content: " (" attr(href) ")"; font-size: 0.8em; color: var(--text2); }
  .cover-banner { background: none; color: var(--text); padding: 24px 0; }
  .cover-banner h1 { color: var(--text); }
}
</style>
</head>
<body>
<!-- Progress Bar -->
<div class="progress-bar" id="progressBar"></div>

<!-- Sticky Chapter Header (mobile) -->
<div class="chapter-header-bar" id="chapterBar">
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation">&#9776;</button>
  <span class="chapter-header-text" id="chapterBarText"></span>
</div>

<!-- Controls -->
<div class="controls-bar">
  <div class="theme-toggle" id="themeToggle">
    <button data-set-theme="light" title="Light" aria-label="Light theme">&#9788;</button>
    <button data-set-theme="dark" title="Dark" aria-label="Dark theme">&#9790;</button>
    <button data-set-theme="book" title="Book" aria-label="Book theme">&#128214;</button>
  </div>
  <div class="font-controls">
    <button id="fontMinus" title="Smaller text" aria-label="Decrease font size">A&minus;</button>
    <button id="fontPlus" title="Larger text" aria-label="Increase font size">A+</button>
  </div>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-title">
    {{TITLE}}
    <small>{{SUBTITLE}}</small>
  </div>
  <nav id="sidebarNav">
    {{SIDEBAR_NAV}}
    <!--
    Example sidebar navigation structure:

    <div class="part-label">Part I &mdash; Foundations</div>
    <a href="#ch1" class="ch">1. First Chapter Title</a>
    <a href="#ch1-section1">Section One</a>
    <a href="#ch1-section2">Section Two</a>
    <a href="#ch2" class="ch">2. Second Chapter Title</a>
    <a href="#ch2-section1">Section One</a>
    -->
  </nav>
  <div class="sidebar-footer">{{FOOTER}}</div>
</div>

<!-- Main Content -->
<div class="main" id="mainContent">
  <!-- Cover -->
  <div class="cover-banner">
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{DESCRIPTION}}</div>
  </div>

  {{CONTENT}}
  <!--
  Each chapter follows this structure:

  <h2 id="ch1"><span class="ch-num">Chapter 1</span> Chapter Title</h2>
  <div class="chapter-summary">
    <div class="reading-time">~8 min read</div>
    <strong>Key question:</strong> What central question does this chapter answer?
  </div>

  <h3 id="ch1-section1">Section Title</h3>
  <p>Content paragraphs, lists, etc.</p>

  (callouts, code blocks, diagrams, tables as needed)

  <div class="references">
    <h4>Further Reading</h4>
    <ul>
      <li><a href="URL" target="_blank" rel="noopener">Resource Title</a> &mdash; Brief description.</li>
    </ul>
  </div>

  <div class="chapter-nav">
    <button class="chapter-prev" data-target="ch0" disabled>&larr; Previous</button>
    <button class="chapter-next" data-target="ch2">Next: Chapter Title &rarr;</button>
  </div>
  -->

  <!-- Master Bibliography -->
  <h2 id="bibliography">Bibliography</h2>
  <ol class="bibliography-list">
    {{BIBLIOGRAPHY}}
  </ol>
</div>

<!-- Back to Top -->
<button class="back-to-top" id="backToTop" aria-label="Back to top">&#8593;</button>

<!-- Continue Reading Banner -->
<div class="bookmark-banner" id="bookmarkBanner">
  <span>Continue where you left off?</span>
  <button id="bookmarkGo">Go</button>
  <button id="bookmarkDismiss">Dismiss</button>
</div>

<!-- Diagram Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-content" id="lightboxContent"></div>
</div>

<script>
(function() {
  'use strict';

  // ── Helpers ──
  var $ = function(s, p) { return (p || document).querySelector(s); };
  var $$ = function(s, p) { return Array.from((p || document).querySelectorAll(s)); };

  function ls(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    } catch(e) { return null; }
  }

  // ── Theme Toggle ──
  var root = document.documentElement;
  var savedTheme = ls('lg-theme') || 'light';
  root.setAttribute('data-theme', savedTheme);

  function setTheme(t) {
    root.setAttribute('data-theme', t);
    ls('lg-theme', t);
    $$('[data-set-theme]').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-set-theme') === t);
    });
  }
  setTheme(savedTheme);

  $$('[data-set-theme]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setTheme(btn.getAttribute('data-set-theme'));
    });
  });

  // ── Font Size ──
  var sizes = ['small', 'medium', 'large'];
  var sizeIdx = sizes.indexOf(ls('lg-font-size') || 'medium');
  if (sizeIdx < 0) sizeIdx = 1;
  root.setAttribute('data-size', sizes[sizeIdx]);

  $('#fontMinus').addEventListener('click', function() {
    if (sizeIdx > 0) { sizeIdx--; root.setAttribute('data-size', sizes[sizeIdx]); ls('lg-font-size', sizes[sizeIdx]); }
  });
  $('#fontPlus').addEventListener('click', function() {
    if (sizeIdx < sizes.length - 1) { sizeIdx++; root.setAttribute('data-size', sizes[sizeIdx]); ls('lg-font-size', sizes[sizeIdx]); }
  });

  // ── Drawer Navigation ──
  var sidebar = $('#sidebar');
  var overlay = $('#sidebarOverlay');
  var menuBtn = $('#menuBtn');

  function openDrawer() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
  }
  function closeDrawer() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
  }

  menuBtn.addEventListener('click', openDrawer);
  overlay.addEventListener('click', closeDrawer);
  $('#chapterBarText').addEventListener('click', openDrawer);

  // Close drawer on nav link click (mobile)
  $$('.sidebar a').forEach(function(a) {
    a.addEventListener('click', function() {
      if (window.innerWidth <= 900) closeDrawer();
    });
  });

  // Swipe to open/close drawer
  var touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (dy > 50) return; // vertical swipe, ignore
    if (dx > 60 && touchStartX < 30) openDrawer();
    if (dx < -60 && sidebar.classList.contains('open')) closeDrawer();
  }, { passive: true });

  // ── Scroll Spy ──
  var headings = $$('h2[id], h3[id]');
  var navLinks = $$('#sidebarNav a');

  if (headings.length && navLinks.length) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var id = entry.target.id;
          navLinks.forEach(function(link) {
            link.classList.toggle('active', link.getAttribute('href') === '#' + id);
          });
          var active = $('#sidebarNav a.active');
          if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      });
    }, { rootMargin: '-10% 0px -85% 0px' });
    headings.forEach(function(h) { observer.observe(h); });
  }

  // ── Progress Bar ──
  var progressBar = $('#progressBar');
  var ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        var pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
        progressBar.style.width = Math.min(pct, 100) + '%';
        ticking = false;
      });
      ticking = true;
    }
  });

  // ── Sticky Chapter Header (mobile) ──
  var chapterBarText = $('#chapterBarText');
  var h2s = $$('h2[id]');
  window.addEventListener('scroll', function() {
    if (window.innerWidth > 900) return;
    var current = '';
    h2s.forEach(function(h) {
      if (h.getBoundingClientRect().top < 60) current = h.textContent;
    });
    if (current) chapterBarText.textContent = current;
  });

  // ── Code Copy Buttons ──
  $$('.code-block').forEach(function(block) {
    var pre = $('pre', block);
    if (!pre) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Copy code');
    btn.addEventListener('click', function() {
      var code = $('code', pre) || pre;
      navigator.clipboard.writeText(code.textContent).then(function() {
        btn.textContent = 'Copied!';
        btn.classList.add('visible');
        setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('visible'); }, 2000);
      });
    });
    block.appendChild(btn);
  });

  // ── Continue-Reading Bookmark ──
  var bmKey = 'lg-bookmark-' + (location.pathname || 'default');
  var savedPos = parseInt(ls(bmKey), 10);
  var banner = $('#bookmarkBanner');

  if (savedPos && savedPos > 300) {
    setTimeout(function() { banner.classList.add('visible'); }, 600);
  }

  $('#bookmarkGo').addEventListener('click', function() {
    window.scrollTo({ top: savedPos, behavior: 'smooth' });
    banner.classList.remove('visible');
  });
  $('#bookmarkDismiss').addEventListener('click', function() {
    banner.classList.remove('visible');
    ls(bmKey, '0');
  });

  var bmTimer;
  window.addEventListener('scroll', function() {
    clearTimeout(bmTimer);
    bmTimer = setTimeout(function() {
      if (window.scrollY > 200) ls(bmKey, String(window.scrollY));
    }, 2000);
  });

  // ── Back to Top ──
  var btt = $('#backToTop');
  window.addEventListener('scroll', function() {
    btt.classList.toggle('visible', window.scrollY > 500);
  });
  btt.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ── Prev/Next Chapter Navigation ──
  $$('.chapter-nav button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var target = document.getElementById(btn.getAttribute('data-target'));
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  });

  // ── Keyboard Navigation ──
  document.addEventListener('keydown', function(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

    if (e.key === 'Escape') { closeDrawer(); return; }

    if (e.key === 'j' || e.key === 'ArrowDown' && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      jumpHeading(1);
    }
    if (e.key === 'k' || e.key === 'ArrowUp' && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      jumpHeading(-1);
    }
  });

  function jumpHeading(dir) {
    var scrollTop = window.scrollY + 80;
    var idx = -1;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].offsetTop > scrollTop) { idx = i; break; }
    }
    if (dir === -1) {
      idx = idx <= 0 ? 0 : idx - 1;
      if (headings[idx].offsetTop >= scrollTop) idx = Math.max(0, idx - 1);
    } else {
      if (idx < 0) idx = headings.length - 1;
    }
    headings[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Diagram Lightbox (mobile) ──
  var lightbox = $('#lightbox');
  var lbContent = $('#lightboxContent');

  $$('.figure').forEach(function(fig) {
    fig.addEventListener('click', function() {
      if (window.innerWidth > 900) return;
      lbContent.innerHTML = fig.innerHTML;
      lightbox.classList.add('visible');
    });
  });
  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox || e.target === lbContent) {
      lightbox.classList.remove('visible');
    }
  });

})();
</script>
</body>
</html>
